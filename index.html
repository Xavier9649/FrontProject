<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CENESTUR - Sistema de Boletos de Cine</title>

    <!-- Bootstrap 5: Framework CSS base -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <!-- Hojas de estilos personalizadas -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Contenedor raíz donde se monta la aplicación React -->
    <div id="root"></div>

    <!-- Librerías de React 18 -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel Standalone: Transpila código JSX directamente en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Bootstrap JS: Componentes interactivos de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jsPDF: Generación y descarga de comprobantes en formato PDF -->
    <script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

    <!-- Capa de datos y funciones utilitarias -->
    <script type="text/babel" src="js/data/peliculas.js"></script>

    <!-- Módulo de Miguel: Utilidad para la generación y descarga del boleto en PDF -->
    <script type="text/babel" src="js/utils/pdfBoleto.js"></script>

    <!-- Módulo de Erick: Componentes de interfaz, cartelera y navegación -->
    <script type="text/babel" src="js/components/Navbar.jsx"></script>
    <script type="text/babel" src="js/components/Footer.jsx"></script>
    <script type="text/babel" src="js/components/FilterBar.jsx"></script>
    <script type="text/babel" src="js/components/MovieCard.jsx"></script>
    <script type="text/babel" src="js/components/MovieList.jsx"></script>

    <!-- Módulo de Miguel: Componentes de compra, selección de asientos y confirmación -->
    <script type="text/babel" src="js/components/SeatSelector.jsx"></script>
    <script type="text/babel" src="js/components/TicketForm.jsx"></script>
    <script type="text/babel" src="js/components/PurchaseSummary.jsx"></script>

    <!-- Módulo de Jorge: Historial de compras, barra de búsqueda y estadísticas -->
    <script type="text/babel" src="js/components/SearchBar.jsx"></script>
    <script type="text/babel" src="js/components/PurchaseItem.jsx"></script>
    <script type="text/babel" src="js/components/PurchaseList.jsx"></script>
    <script type="text/babel" src="js/components/Statistics.jsx"></script>

    <!-- Componente raíz y punto de entrada de la aplicación -->
    <script type="text/babel" src="js/App.jsx"></script>
    <script type="text/babel" src="js/main.jsx"></script>
</body>

</html>
